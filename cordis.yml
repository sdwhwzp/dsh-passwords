# DeepSeek Harness 接入 dsh-passwords 的 patch 配置
#
# 推荐安装方式（install.sh 已自动完成）：
#   dsh plugin --profile web add link:/path/to/dsh-passwords
# 本包声明了 dsh.bundle.patch，注册后此文件会作为 bundle 层被 dsh 自动应用，
# 启动 dsh 无需任何额外参数。
#
# 手动方式（二选一，用于不想注册插件的情况）：
#   dsh web --patch ./cordis.yml
# 或把本文件内容合并进 ~/.dsh/profiles/web/cordis.patch.yml

# DSH 0.1.2-alpha.1+ 已原生加载目录选择器。这里不能重复插入官方
# directory-picker-browse/ui-directory-picker-browse，否则 profile 组合后会出现
# duplicate loader entry id。只注册 dsh-passwords 自身的主机侧插件。
- insert:
    - id: dsh-passwords
      name: 'dsh-passwords'
